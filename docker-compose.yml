name: vigil

services:
  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    image: vigil-collector
    ports:
      - "9090:9090"
      - "2112:2112"
    depends_on:
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - KAFKA_ADDR=kafka:9092
      - METRICS_ADDR=:2112
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    image: vigil-agent
    hostname: honnek-G5-GE
    depends_on:
      - collector
      - jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_ADDR=collector:9090
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    image: vigil-storage
    ports:
      - "9091:9091"
      - "2113:2112"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - POSTGRES_DSN=postgres://vigil:secret@postgres:5432/vigil?sslmode=disable
      - REDIS_ADDR=redis:6379
      - METRICS_ADDR=:2112
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    restart: unless-stopped

  logstorage:
    build:
      context: .
      dockerfile: services/logstorage/Dockerfile
    image: vigil-logstorage
    ports:
      - "9095:9095"   # gRPC LogsQuery
      - "2118:2112"   # метрики
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - KAFKA_ADDR=kafka:9092
      - CH_ADDR=clickhouse:9000
      - CLICKHOUSE_DB=vigil
      - CLICKHOUSE_USER=vigil
      - CLICKHOUSE_PASS=secret
      - CLICKHOUSE_DSN=clickhouse://vigil:secret@clickhouse:9000/vigil
      - GRPC_ADDR=:9095
      - METRICS_ADDR=:2112
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    restart: unless-stopped

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    image: vigil-processor
    ports:
      - "2115:2112"
    depends_on:
      kafka:
        condition: service_healthy
      storage:
        condition: service_started
      jaeger:
        condition: service_started
    environment:
      - KAFKA_ADDR=kafka:9092
      - STORAGE_ADDR=storage:9091
      - METRICS_ADDR=:2112
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    restart: unless-stopped

  alerter:
    build:
      context: .
      dockerfile: services/alerter/Dockerfile
    image: vigil-alerter
    ports:
      - "2116:2112"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - KAFKA_ADDR=kafka:9092
      - REDIS_ADDR=redis:6379
      - METRICS_ADDR=:2112
    restart: unless-stopped

  notifier:
    build:
      context: .
      dockerfile: services/notifier/Dockerfile
    image: vigil-notifier
    ports:
      - "2117:2112"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_ADDR=kafka:9092
      - METRICS_ADDR=:2112
    env_file:
      - .env
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: vigil-api
    ports:
      - "8080:8080"
      - "2114:2112"
    depends_on:
      storage:
        condition: service_started
      logstorage:
        condition: service_started
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - STORAGE_ADDR=storage:9091
      - LOGSTORAGE_ADDR=logstorage:9095
      - API_ADDR=:8080
      - REDIS_ADDR=redis:6379
      - METRICS_ADDR=:2112
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    env_file:
      - .env
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=vigil
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=vigil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP — UI/отладка, grafana-плагин
      - "9000:9000"   # native TCP — сюда ходит Go-драйвер (clickhouse-go)
    environment:
      CLICKHOUSE_USER: vigil
      CLICKHOUSE_PASSWORD: secret
      CLICKHOUSE_DB: vigil
      # разрешить обращение к БД под юзером с паролем без доп. настройки профилей
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      # ClickHouse держит много открытых файлов (куски MergeTree)
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      # 127.0.0.1, а не localhost: внутри контейнера localhost=::1 (IPv6), а CH слушает только IPv4
      test: ["CMD", "wget", "--no-verbose", "--spider", "-q", "127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    ports:
      # EXTERNAL-listener наружу: через него ходят поды из minikube
      - "9094:9094"
    environment:
      # KRaft: один узел совмещает роли брокера и контроллера (без Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # слушатели: PLAINTEXT — клиенты в compose, CONTROLLER — кворум, EXTERNAL — клиенты извне (minikube)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # брокер диктует клиенту адрес, по которому с ним работать — свой на каждый listener
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.minikube.internal:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # одиночный узел → фактор репликации служебных топиков = 1 (дефолт 3 не стартует)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Web UI
      - "4317:4317"     # OTLP gRPC — сюда сервисы шлют трейсы
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource   # датасорс ClickHouse — плагин
    depends_on:
      - prometheus
      - clickhouse
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
  chdata:
