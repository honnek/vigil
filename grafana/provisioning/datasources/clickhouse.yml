apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse                 # фиксируем uid, чтобы дашборд ссылался стабильно
    access: proxy
    jsonData:
      host: clickhouse
      port: 9000                    # native TCP
      protocol: native
      username: vigil
      defaultDatabase: vigil
    secureJsonData:
      password: secret
