syntax = "proto3";

package anomaly;

option go_package = "github.com/honnek/vigil/proto;metric";

import "google/protobuf/timestamp.proto";

message Anomaly {
  string host = 1;
  string metric_name = 2;
  double value = 3;
  double mean = 4;
  double std_dev = 5;
  double zscore = 6;
  double confidence = 7;
  google.protobuf.Timestamp timestamp = 8;
  string pattern = 9;
}
